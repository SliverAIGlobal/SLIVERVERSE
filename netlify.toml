[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-SLIAIDE-Node = "SLIAIDE-MAIN-709A"
    X-SLIAIDE-Operator = "Heather Soares"
    X-SLIAIDE-Epoch = "2026-10-20"
    X-SLIAIDE-Tx-Threshold = "0.9950"
    X-Gumroad-Resale-License = "P2P-DEVELOPER-PERPETUAL"
