[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  function = "license-validator"
  path = "/*"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Gumroad-P2P-Compliance = "true"
    X-SAT-AI-Verification = "T(x)=0.998"
    Content-Security-Policy = "upgrade-insecure-requests; block-all-mixed-content;"
    X-SLIAIDE-Node = "SLIAIDE-MAIN-709A"
    X-SLIAIDE-Operator = "Heather Soares"
    X-SLIAIDE-Epoch = "2026-10-20"
